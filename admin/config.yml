          "label": "Cuisine",
          "widget": "string"
        },
        {
          "name": "serves",
          "label": "Serves",
          "widget": "number",
          "value_type": "int",
          "min": 1
        },
        {
          "name": "time",
          "label": "Time",
          "widget": "string",
          "hint": "Use the time format shown on the site, e.g. 2:30."
        },
        {
          "name": "ingredients",
          "label": "Ingredients",
          "widget": "list",
          "min": 1
        },
        {
          "name": "steps",
          "label": "Method steps",
          "widget": "list",
          "min": 1
        },
        {
          "name": "notes",
          "label": "Notes",
          "widget": "text",
          "required": false
        }
