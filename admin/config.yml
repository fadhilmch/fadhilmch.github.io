    {
      "name": "coffee",
      "label": "Coffee",
      "label_singular": "Coffee recipe",
      "folder": "_coffee",
      "path": "{{slug}}",
      "extension": "md",
      "format": "yaml-frontmatter",
      "create": true,
      "delete": false,
      "publish": false,
      "fields": [
        {
          "name": "layout",
          "label": "Layout",
          "widget": "hidden",
          "default": "recipe"
        },
        {
          "name": "title",
          "label": "Title",
          "widget": "string"
        },
        {
          "name": "kind",
          "label": "Recipe type",
          "widget": "hidden",
          "default": "coffee"
        },
        {
          "name": "method",
          "label": "Brew method",
          "widget": "string"
        },
        {
          "name": "dose_g",
          "label": "Coffee dose (g)",
          "widget": "number",
          "value_type": "float",
          "min": 0.1,
          "step": 0.1
        },
        {
          "name": "water_g",
          "label": "Water (g)",
          "widget": "number",
          "value_type": "float",
          "min": 0.1,
          "step": 0.1
        },
        {
          "name": "grind",
          "label": "Grind setting",
          "widget": "string"
        },
        {
          "name": "temp_c",
          "label": "Water temperature (°C)",
          "widget": "number",
          "value_type": "float",
          "min": 0.1,
          "step": 0.1
        },
        {
          "name": "time",
          "label": "Time",
          "widget": "string",
          "hint": "Use the time format shown on the site, e.g. 2:30."
        },
        {
          "name": "beans",
          "label": "Beans",
          "widget": "string",
          "required": false
        },
        {
          "name": "steps",
          "label": "Brew steps",
          "widget": "list",
          "min": 1
        },
        {
          "name": "notes",
          "label": "Notes",
          "widget": "text",
          "required": false
        }
      ]
    },
    {
      "name": "food",
      "label": "Food",
      "label_singular": "Food recipe",
      "folder": "_food",
      "path": "{{slug}}",
      "extension": "md",
      "format": "yaml-frontmatter",
      "create": true,
