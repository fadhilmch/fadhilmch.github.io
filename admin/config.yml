{
  "backend": {
    "name": "github",
    "repo": "fadhilmch/fadhilmch.github.io",
    "branch": "master",
    "auth_methods": [
      "token"
    ]
  },
  "publish_mode": "editorial_workflow",
  "site_url": "https://fadhilmch.github.io",
  "app_title": "Fadhil · Site editor",
  "media_folder": "admin/media-readonly",
  "public_folder": "/admin/media-readonly",
  "collections": [
    {
      "name": "posts",
      "label": "Blog posts",
      "publish": false,
      "delete": false,
      "editor": {
        "preview": true
      },
      "folder": "_posts",
      "format": "post-raw",
      "slug": {
        "editable": [
          "create"
        ],
        "hint": "Enter the new post filename as YYYY-MM-DD-slug, for example 2026-10-14-my-new-post.",
        "pattern": [
          "^\\d{4}-\\d{2}-\\d{2}-[a-z0-9]+(?:-[a-z0-9]+)*$",
          "Use YYYY-MM-DD-slug with lowercase words separated by hyphens"
        ]
      },
      "fields": [
        {
          "name": "body",
          "label": "Full post source (YAML + Markdown + HTML)",
          "widget": "post-source",
          "hint": "Edit title, date and article content in this source. For a new post, open the Slug panel in the sidebar and set YYYY-MM-DD-slug. Save opens a review PR, never publishes."
        }
      ]
    },
    {
      "name": "about",
      "label": "About",
      "publish": false,
      "files": [
        {
          "name": "profile",
          "label": "Profile",
          "file": "_data/profile.yml",
          "fields": [
            {
              "name": "name",
              "label": "Name",
              "widget": "string"
            },
            {
              "name": "short_role",
              "label": "Short role",
              "widget": "string"
            },
            {
              "name": "city",
              "label": "City",
              "widget": "string"
            },
            {
              "name": "role",
              "label": "Role",
              "widget": "string"
            },
            {
              "name": "location",
              "label": "Location",
              "widget": "string"
            },
            {
              "name": "headline",
              "label": "Headline",
              "widget": "string"
            },
            {
              "name": "greetings",
              "label": "Greetings",
              "widget": "list",
              "fields": [
                {
                  "name": "word",
                  "label": "Word",
                  "widget": "string"
                },
                {
                  "name": "lang",
                  "label": "Language",
                  "widget": "string"
                }
              ]
            },
            {
              "name": "bio_links",
              "label": "Interactive bio links",
              "widget": "list",
              "fields": [
                {
                  "name": "text",
                  "label": "Text",
                  "widget": "string"
                },
                {
                  "name": "node",
                  "label": "Graph node",
                  "widget": "string",
                  "required": false
                },
                {
                  "name": "href",
                  "label": "Link URL",
                  "widget": "string",
                  "required": false
                },
                {
                  "name": "color",
                  "label": "Color",
                  "widget": "string",
                  "required": false
                }
              ]
            },
            {
              "name": "bio",
              "label": "Bio",
              "widget": "text"
            },
            {
              "name": "flag",
              "label": "Flag",
              "widget": "string"
            },
            {
              "name": "now",
              "label": "Now",
              "widget": "list",
              "fields": [
                {
                  "name": "k",
                  "label": "Label",
                  "widget": "string"
                },
                {
                  "name": "v",
                  "label": "Value",
                  "widget": "string"
                },
                {
                  "name": "href",
                  "label": "Link URL",
                  "widget": "string",
                  "required": false
                }
              ]
            },
            {
              "name": "off_hours",
              "label": "Off hours",
              "widget": "string"
            }
          ]
        },
        {
          "name": "lanes",
          "label": "Lanes",
          "file": "_data/lanes.yml",
          "fields": [
            {
              "name": "items",
              "label": "Lanes",
              "widget": "list",
              "fields": [
                {
                  "name": "key",
                  "label": "Key",
                  "widget": "hidden"
                },
                {
                  "name": "branch",
                  "label": "Branch visible",
                  "widget": "boolean",
                  "required": false,
                  "default": true,
                  "hint": "Set Product design to true when enabling the Product design skill group."
                },
                {
                  "name": "title",
                  "label": "Title",
                  "widget": "string"
                },
                {
                  "name": "label",
                  "label": "Label",
                  "widget": "string"
                },
                {
                  "name": "long",
                  "label": "Long label",
                  "widget": "string"
                },
                {
                  "name": "color",
                  "label": "Color",
                  "widget": "select",
                  "options": [
                    {
                      "label": "Blue",
                      "value": "l0"
                    },
                    {
                      "label": "Rose",
                      "value": "l1"
                    },
                    {
                      "label": "Orange",
                      "value": "l2"
                    },
                    {
                      "label": "Purple",
                      "value": "l3"
                    },
                    {
                      "label": "Teal",
                      "value": "l4"
                    },
                    {
                      "label": "Gold",
                      "value": "l5"
                    },
                    {
                      "label": "Neutral",
                      "value": "fg"
                    }
                  ]
                },
                {
                  "name": "tags",
                  "label": "Tags",
                  "widget": "list"
                }
              ],
              "max": 7,
              "root": true
            }
          ]
        }
      ]
    },
