title: Fadhil Mochammad
tagline: ML platforms, evaluation, and the parts that aren't the model.
description: >-
  Machine learning platforms, experimentation, and agent systems in production.
author: Fadhil Mochammad
email: fadhil.mochammad1095@gmail.com
url: https://fadhilmch.github.io
baseurl: ""
github_username: fadhilmch
linkedin_username: fadhilmch
twitter:
  card: summary_large_image
google_site_verification: isqDPfhl_ygE-BjKyXaufxOofzxuwccFMeswShdh6eU
timezone: Europe/Stockholm
markdown: kramdown
highlighter: rouge
permalink: /posts/:title/

collections:
  notes:
    output: true
    permalink: /notes/:name/
  coffee:
    output: true
    permalink: /after-work/coffee/:name/
  food:
    output: true
    permalink: /after-work/food/:name/

defaults:
  - scope:
      path: ""
    values:
      image: /assets/og-default.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: notes
    values:
      layout: note
      nav: notes
  - scope:
      path: ""
      type: coffee
    values:
      layout: recipe
      nav: after-work
      kind: coffee
  - scope:
      path: ""
      type: food
    values:
      layout: recipe
      nav: after-work
      kind: food

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: /feed.xml

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - docs
  - scripts
  - _archive
  - README.md
  - README.MD
  - uploads
  - node_modules
