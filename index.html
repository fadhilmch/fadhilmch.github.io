---
layout: base
title: About
nav: about
---
{%- assign profile = site.data.profile -%}
<div class="about-page">
  <section class="hero" aria-labelledby="about-title">
    <h1 id="about-title">{{ profile.headline | escape }}</h1>
    <p>{{ profile.bio | escape }}</p>
    <div class="avatar" aria-hidden="true">
      <img class="avatar__img"
        src="{{ '/assets/images/fadhil-avatar-600.webp' | relative_url }}"
        srcset="{{ '/assets/images/fadhil-avatar-300.webp' | relative_url }} 300w, {{ '/assets/images/fadhil-avatar-600.webp' | relative_url }} 600w"
        sizes="(max-width: 680px) 176px, 230px"
        width="600" height="610" alt="" decoding="async">
    </div>
  </section>

  <span id="node-exp"></span><span id="node-work"></span>
  {% include workflow/canvas.html %}
  {% include workflow/panels.html %}
</div>
