name: Validate stroller bus timetable
on:
  push:
    branches: [stroller-bus-planner]
    paths:
      - '.github/workflows/stroller-validation.yml'
      - 'scripts/stroller-bus/import_gtfs.py'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build filtered timetable
        env:
          TRAFIKLAB_GTFS_KEY: ${{ secrets.TRAFIKLAB_GTFS_KEY }}
        run: python scripts/stroller-bus/import_gtfs.py stroller-bus/data
      - name: Save public timetable on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stroller-bus/data
          git diff --cached --quiet || git commit -m 'Add filtered validation timetable [skip ci]'
          git push origin HEAD:stroller-bus-planner
