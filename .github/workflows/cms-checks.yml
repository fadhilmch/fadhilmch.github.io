name: CMS source checks
on:
  pull_request:
    paths: ['_posts/**', 'admin/**', 'tests/**', '.github/workflows/cms-checks.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec jekyll build --trace
      - run: bundle exec htmlproofer _site --disable-external --ignore-missing-alt
