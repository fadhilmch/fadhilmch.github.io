<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="Illustrative map of the Bookio build: React and Redux front end connected to Firebase, Algolia, Google Maps and the Goodreads API">
  <g fill="none" stroke="#7a7873" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="240" y="14" width="160" height="56" rx="10"/>
    <rect x="20" y="120" width="120" height="52" rx="8"/>
    <rect x="170" y="120" width="110" height="52" rx="8"/>
    <rect x="310" y="120" width="120" height="52" rx="8"/>
    <rect x="460" y="120" width="130" height="52" rx="8"/>
    <path d="M300 70v20M290 86l10 10 10-10M300 96v24" transform="translate(0 -4)"/>
    <path d="M270 60L85 120M300 70L225 120M340 66L375 120M370 60L525 120" stroke-dasharray="5 5"/>
    <path d="M52 146h56M52 158h36" stroke-dasharray="1 7"/>
    <circle cx="600" cy="146" r="10" fill="#e8765a" transform="translate(-14 0)"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#7a7873" text-anchor="middle">
    <text x="320" y="40">React + Redux app</text><text x="320" y="56" fill="#e8765a">CRA, SCSS</text>
    <text x="80" y="140">Firestore</text><text x="80" y="164">Auth + Storage</text>
    <text x="225" y="140">Algolia</text><text x="225" y="156" fill="#e8765a">search sync</text>
    <text x="370" y="140">Google Maps</text><text x="370" y="156">pick-up points</text>
    <text x="525" y="140">Goodreads API</text><text x="525" y="156">book details</text>
    <text x="320" y="206" font-size="12">Firebase services on the left, external APIs on the right - illustrative</text>
  </g>
</svg>
