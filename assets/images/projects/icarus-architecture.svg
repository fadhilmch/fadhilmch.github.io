<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 222" role="img" aria-label="Icarus architecture: participants and organisers use the Next.js web app, which calls a separate Express API. Both run on AWS EC2. Firebase Authentication handles sign-in. Strava calls the API through a webhook, and the API fetches each new activity.">
  <g fill="none" stroke="#7a7873" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="16" y="96" width="112" height="56" rx="8"/>
    <rect x="152" y="64" width="304" height="120" rx="12" stroke-dasharray="6 6"/>
    <rect x="176" y="96" width="120" height="56" rx="8"/>
    <rect x="328" y="96" width="120" height="56" rx="8" stroke="#2a8f9c"/>
    <rect x="176" y="8" width="120" height="40" rx="8"/>
    <rect x="528" y="96" width="100" height="56" rx="8"/>
    <path d="M128 124H174M166 116l8 8-8 8M296 124H326M318 116l8 8-8 8"/>
    <path d="M236 96V50" stroke-dasharray="4 5"/>
    <path d="M528 114H450M458 106l-8 8 8 8M448 138H526M518 130l8 8-8 8" stroke="#2a8f9c"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#7a7873" text-anchor="middle">
    <text x="72" y="120">Participants</text><text x="72" y="136">and organisers</text>
    <text x="168" y="174" text-anchor="start" font-size="12" fill="#2a8f9c">AWS (EC2)</text>
    <text x="236" y="120">Next.js web app</text><text x="236" y="136" font-size="12">events, sign-up</text>
    <text x="388" y="120">Express API</text><text x="388" y="136" font-size="12">events, activities</text>
    <text x="236" y="33">Firebase Auth</text>
    <text x="578" y="120">Strava</text><text x="578" y="136" font-size="12">runs and rides</text>
    <text x="492" y="104" font-size="11" fill="#2a8f9c">webhook</text>
    <text x="492" y="158" font-size="11" fill="#2a8f9c">fetch activity</text>
    <text x="320" y="212" font-size="12">The web app and the API deploy separately. Strava tells the API about each new activity.</text>
  </g>
</svg>
