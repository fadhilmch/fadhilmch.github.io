<body>
<header>
 <h1>Two queries, one merge</h1>
 <p>How a multilingual chatbot finds the right document: hybrid search, translation by country, and a max-score merge.</p>
</header>
<main>
 <nav aria-label="Steps"><ol id="steps"></ol></nav>
 <section class="panel" aria-live="off">
  <h2 id="step-title"></h2>
  <p id="step-summary"></p>
  <div class="stage"><svg id="stage" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="step-title" aria-describedby="caption"></svg></div>
  <div id="caption" aria-live="polite"></div>
  <div class="controls">
   <button type="button" id="prev" aria-label="Previous step">&larr;</button>
   <button type="button" id="play">Play</button>
   <button type="button" id="next" aria-label="Next step">&rarr;</button>
   <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Timeline">
   <select id="speed" aria-label="Speed"><option value="0.5">0.5&times;</option><option value="1" selected>1&times;</option><option value="1.5">1.5&times;</option><option value="2">2&times;</option></select>
   <label class="auto"><input type="checkbox" id="autoadv" checked> auto-advance</label>
  </div>
  <div id="phases"></div>
 </section>
</main>
<footer>&larr;/&rarr; change step &middot; space plays/pauses &middot; link to a moment with <code>#s=2&amp;t=0.5</code><div id="errlog" hidden></div></footer>
<script>
(function(){
window.addEventListener('error',function(e){ var d=document.getElementById('errlog'); if(d){ d.textContent+=(e.message||'error')+' @line '+(e.lineno||'?')+'\n'; if(location.search.indexOf('debug')>-1) d.hidden=false; } });

/* ---------- tiny deterministic animation toolkit ---------- */
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>{ if(a===undefined) a=0; if(b===undefined) b=1; return Math.max(a,Math.min(b,v)); };
const lerp=(a,b,t)=>a+(b-a)*t;
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const linear=t=>t;
function seg(t,a,b,ease){ return (ease||easeIO)(clamp((t-a)/(b-a))); }
function inout(t,a,b,c,d){ return Math.min(seg(t,a,b),1-seg(t,c,d)); }
const fmt=n=>n.toLocaleString('en-US');
function rng(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function el(name,attrs,parent){ const e=document.createElementNS(NS,name); if(attrs) for(const k in attrs){ const v=attrs[k]; if(v!==undefined&&v!==null) e.setAttribute(k,v); } if(parent) parent.appendChild(e); return e; }
function g(parent,attrs){ return el('g',attrs||{},parent); }
function txt(parent,x,y,s,cls,anchor,extra){ const e=el('text',Object.assign({x:x,y:y,'class':cls||'t-sm','text-anchor':anchor||'start'},extra||{}),parent); e.textContent=s; return e; }
function lines(parent,x,y,arr,cls,lh,anchor){ const gg=g(parent); arr.forEach((s,i)=>txt(gg,x,y+i*(lh||16),s,cls,anchor)); return gg; }
function rect(parent,x,y,w,h,r,cls,extra){ return el('rect',Object.assign({x:x,y:y,width:w,height:h,rx:r==null?6:r,ry:r==null?6:r,'class':cls==null?'box':cls},extra||{}),parent); }
function circ(parent,cx,cy,r,cls,extra){ return el('circle',Object.assign({cx:cx,cy:cy,r:r,'class':cls==null?'':cls},extra||{}),parent); }
function line(parent,x1,y1,x2,y2,cls,extra){ return el('line',Object.assign({x1:x1,y1:y1,x2:x2,y2:y2,'class':cls||'wire'},extra||{}),parent); }
function path(parent,d,cls,extra){ return el('path',Object.assign({d:d,'class':cls||'wire'},extra||{}),parent); }
function arrow(parent,x1,y1,x2,y2,cls,marker){ return path(parent,'M'+x1+' '+y1+' L'+x2+' '+y2,cls||'wire',{'marker-end':'url(#'+(marker||'arr')+')'}); }
function curve(parent,x1,y1,x2,y2,cls,marker){ const mx=(x1+x2)/2; return path(parent,'M'+x1+' '+y1+' C '+mx+' '+y1+', '+mx+' '+y2+', '+x2+' '+y2,cls||'wire',marker?{'marker-end':'url(#'+marker+')'}:{}); }
function op(e,v){ e.setAttribute('opacity',clamp(v).toFixed(3)); }
function tr(e,x,y,s){ e.setAttribute('transform','translate('+x.toFixed(2)+' '+y.toFixed(2)+')'+(s==null?'':' scale('+s.toFixed(3)+')')); }
function node(parent,x,y,w,h,label,cls,sub){ const gg=g(parent); rect(gg,x,y,w,h,8,cls||'box'); txt(gg,x+w/2,y+h/2+(sub?-2:5),label,'t-sm bold','middle'); if(sub) txt(gg,x+w/2,y+h/2+15,sub,'t-xs muted','middle'); gg._x=x; gg._y=y; gg._w=w; gg._h=h; gg._cx=x+w/2; gg._cy=y+h/2; return gg; }
function chip(parent,x,y,label,cls,fs){ fs=fs||11; const w=Math.max(26,Math.round(label.length*fs*0.62+14)); const gg=g(parent); rect(gg,x,y,w,20,10,cls||'chip'); txt(gg,x+w/2,y+14,label,'t-xs'+((cls||'').indexOf('dark')>-1?' white':''),'middle'); gg._w=w; return gg; }
function prepDraw(p){ const L=p.getTotalLength(); p._len=L; p._marker=p.getAttribute('marker-end'); p.setAttribute('stroke-dasharray',L+' '+L); p.setAttribute('stroke-dashoffset',L); return p; }
function drawOn(p,v){ v=clamp(v); p.setAttribute('stroke-dashoffset',(p._len*(1-v)).toFixed(2)); if(p._marker){ if(v>=0.999) p.setAttribute('marker-end',p._marker); else p.removeAttribute('marker-end'); } }
function moveAlong(e,p,v){ const L=p._len||p.getTotalLength(); const pt=p.getPointAtLength(L*clamp(v)); tr(e,pt.x,pt.y); }
function typeText(e,full,p){ e.textContent=full.slice(0,Math.round(full.length*clamp(p))); }
function count(e,to,p,fmtFn){ e.textContent=(fmtFn||fmt)(Math.round(to*clamp(p))); }
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

/* A document card: language tag + short title, drawn at the origin so it can be moved with tr(). */
const LANG_CLS={en:'tile-1',sv:'tile-4',id:'tile-5'};
const DOC_W=150, DOC_H=26;
function doc(parent,name,lang){ const gg=g(parent); rect(gg,0,0,DOC_W,DOC_H,5,'box'); rect(gg,5,5,24,16,3,LANG_CLS[lang]||'tile-grey'); txt(gg,17,17,lang,'t-xs white bold','middle'); txt(gg,36,17,name,'t-12'); return gg; }

const STEPS=[];

/* ====================== STEPS ====================== */

/* ---------- 1. One search path ---------- */
STEPS.push({
id:'one-path',nav:'One search path',title:'1. One question, one search',
summary:'Hybrid search finds candidates two ways. A reranker scores them.',
duration:13000,
phases:[
{at:0,text:'A question comes in. <b>Keyword search</b> (BM25) and <b>vector search</b> each pull candidate documents from the index.'},
{at:.32,text:'A <b>reranker</b> reads the question and each candidate together and gives every pair a relevance score.'},
{at:.6,text:'Sort by score. A <b>threshold</b> at 2.0 drops the weak tail, so the answer model reads fewer, better documents.'},
{at:.84,text:'The reranker is mostly about <b>ranking</b>: on my questions it barely changed recall but moved the right document much nearer the top, <b>MRR 0.593 to 0.711</b>.'}
],
setup(svg){
 // p1 [0,.32): query (.00-.06), boxes (.04-.10), wires (.08-.14), candidates appear (.12-.28)
 // p2 [.32,.60): reranker band (.32-.38), cards slide into ranked slots (.40-.55)
 // p3 [.60,.84): score bars grow (.60-.72), threshold (.72-.76), tail dims (.76-.80)
 // p4 [.84,1]: callout (.86-.93)
 const Q=node(svg,170,24,620,46,'"What are the parking rules at the Stockholm office?"','box-accent');
 const K=node(svg,170,104,280,54,'Keyword search','box','BM25: matches the words');
 const V=node(svg,510,104,280,54,'Vector search','box','embeddings: match the meaning');
 const w1=prepDraw(arrow(svg,310,70,310,100,'wire-active','arr-accent'));
 const w2=prepDraw(arrow(svg,650,70,650,100,'wire-active','arr-accent'));
 const w3=prepDraw(arrow(svg,310,158,310,186,'wire','arr'));
 const w4=prepDraw(arrow(svg,650,158,650,186,'wire','arr'));
 const R=g(svg); rect(R,40,236,880,36,8,'box-amber-soft'); txt(R,480,259,'Reranker: reads question + document together, scores 0 to 4','t-sm bold','middle');
 const D=[{n:'Parking rules',l:'en',s:3.1},{n:'Commuting FAQ',l:'en',s:1.7},{n:'Visitor access',l:'en',s:0.8},{n:'Parkering',l:'sv',s:2.2},{n:'Office guide',l:'en',s:2.6},{n:'Car policy',l:'en',s:1.2}];
 const ranked=D.map((d,i)=>i).sort((a,b)=>D[b].s-D[a].s);
 const X0=230, PX=110; // score axis: 0..4 -> 230..670
 const thr=g(svg); line(thr,X0+2*PX,286,X0+2*PX,520,'wire wire-dash'); txt(thr,X0+2*PX+6,298,'threshold 2.0','t-xs muted');
 const rows=D.map((d,i)=>{
  const r=ranked.indexOf(i), y=306+r*35;
  const bar=rect(svg,X0,y+5,0,16,3,'tile-1'); const val=txt(svg,X0,y+18,d.s.toFixed(1),'t-xs muted');
  const card=doc(svg,d.n,d.l);
  return {d,r,y,bar,val,card,x0:40+i*148,y0:194};
 });
 const call=g(svg); rect(call,700,330,220,100,8,'box'); lines(call,716,354,['MRR, hybrid search'],'t-xs muted'); txt(call,716,382,'0.711','t-lg'); lines(call,716,404,['with the reranker','without: 0.593'],'t-xs muted',14);
 [Q,K,V,R,thr,call].forEach(e=>op(e,0));
 return {render(t){
  op(Q,seg(t,0,.06)); op(K,seg(t,.04,.1)); op(V,seg(t,.04,.1));
  drawOn(w1,seg(t,.06,.1)); drawOn(w2,seg(t,.06,.1)); drawOn(w3,seg(t,.1,.14)); drawOn(w4,seg(t,.1,.14));
  op(R,seg(t,.32,.38));
  const mv=seg(t,.4,.55), bars=t, dim=seg(t,.76,.8);
  rows.forEach((o,i)=>{
   const a=seg(t,.12+i*.025,.16+i*.025);
   tr(o.card,lerp(o.x0,64,mv),lerp(o.y0,o.y,mv));
   const below=o.d.s<2, fade=below?1-.6*dim:1;
   op(o.card,a*fade);
   const gw=seg(t,.6+o.r*.02,.68+o.r*.02,easeOut);
   o.bar.setAttribute('width',(PX*o.d.s*gw).toFixed(1)); op(o.bar,(gw>0?1:0)*fade);
   o.val.setAttribute('x',(X0+PX*o.d.s*gw+6).toFixed(1)); op(o.val,seg(t,.68+o.r*.02,.7+o.r*.02)*fade);
  });
  op(thr,seg(t,.72,.76)); op(call,seg(t,.86,.93));
 }};
}
});

/* ---------- 2. Same question, another language ---------- */
STEPS.push({
id:'other-language',nav:'Another language',title:'2. The same question, in Indonesian',
summary:'A country filter narrows the index, but a single search still struggles across languages.',
duration:13000,
phases:[
{at:0,text:'The same question, written in <b>Indonesian</b>. It is about the Stockholm office, so a <b>country filter</b> keeps only Swedish and global documents.'},
{at:.36,text:'There are no Indonesian documents. One search compares an Indonesian question with English and Swedish text, and the reranker scores come out <b>low</b>.'},
{at:.68,text:'Nothing clears the threshold, so the answer model gets no source. My overall recall looked fine while Swedish questions sat at <b>55%</b> with this setup.'}
],
setup(svg){
 // p1 [0,.36): query (.00-.06), about chip (.06-.10), index grid (.08-.18), filter dims other regions (.22-.30)
 // p2 [.36,.68): result cards appear (.38-.50), bars grow (.48-.60), threshold (.60-.64)
 // p3 [.68,1]: everything below dims (.68-.72), verdict box (.74-.82)
 const Q=node(svg,140,20,560,52,'Bagaimana aturan parkir di kantor Stockholm?','box-accent','Indonesian: "What are the parking rules at the Stockholm office?"');
 const about=chip(svg,716,36,'about: Sweden','chip-dark',12);
 const gridHead=txt(svg,40,104,'INDEX, FILTERED TO SWEDEN + GLOBAL','t-xs muted');
 const Rg=rng(7), regions=['sweden','global','other','other2'], cls={sweden:'tile-4',global:'tile-1',other:'tile-6',other2:'tile-6'};
 const pool=[]; [16,12,12,8].forEach((n,k)=>{ for(let i=0;i<n;i++) pool.push(regions[k]); });
 for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Rg()*(i+1)); const tmp=pool[i]; pool[i]=pool[j]; pool[j]=tmp; }
 const tiles=pool.map((r,i)=>{ const e=rect(svg,40+(i%8)*48,116+Math.floor(i/8)*36,40,26,4,cls[r]); e._keep=(r==='sweden'||r==='global'); return e; });
 const legend=g(svg); [['Sweden','tile-4'],['Global','tile-1'],['Other countries','tile-6']].forEach((L,k)=>{ rect(legend,40+k*98,344,12,12,2,L[1]); txt(legend,58+k*98,354,L[0],'t-xs muted'); });
 const resHead=txt(svg,470,104,'ONE SEARCH, INDONESIAN QUERY','t-xs muted');
 const D=[{n:'Parking rules',l:'en',s:1.9},{n:'Office guide',l:'en',s:1.6},{n:'Parkering',l:'sv',s:1.4},{n:'Garage access',l:'sv',s:1.1},{n:'Commuting FAQ',l:'en',s:0.9}];
 const X0=636, PX=68; // 0..4 -> 636..908

scrub.addEventListener('input',()=>{ const v=scrub.value/1000; setPlaying(false); t=v; render(); });
speedEl.addEventListener('change',()=>{ speed=parseFloat(speedEl.value)||1; });
document.addEventListener('keydown',e=>{ const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='select'||tag==='textarea') return;
 if(e.key==='ArrowRight'){ loadStep(idx+1); e.preventDefault(); } else if(e.key==='ArrowLeft'){ loadStep(idx-1); e.preventDefault(); } else if(e.key===' '&&tag!=='button'){ playBtn.click(); e.preventDefault(); } });
window.addEventListener('hashchange',()=>{ const h=parseHash(); if(h.s!==idx) loadStep(h.s,{t:h.t,autoplay:h.t==null}); });
window.__explainer={steps:STEPS.length,frame(s,tt){ loadStep(s,{t:tt,autoplay:false}); }};
/* Embedded: report the content height so the host page can size the iframe without scrollbars. */
if(document.documentElement.classList.contains('is-embedded')&&window.ResizeObserver){
 const mainEl=document.querySelector('main');
 new ResizeObserver(()=>{ try{ window.parent.postMessage({explainer:'multilingual-rag',height:Math.ceil(mainEl.getBoundingClientRect().height)},'*'); }catch(e){} }).observe(mainEl);
}
/* Embedded: don't start playing until the reader scrolls the player into view. */
const embedded=document.documentElement.classList.contains('is-embedded');
buildNav(); const h0=parseHash(); loadStep(clamp(h0.s,0,STEPS.length-1),{t:h0.t,autoplay:h0.t==null&&!embedded});
if(embedded&&window.IntersectionObserver){ let started=false; new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting&&!started&&!reduced){ started=true; setPlaying(true); } }); },{threshold:.5}).observe(document.querySelector('.panel')); }
})();
</script>
</body>
</html>
